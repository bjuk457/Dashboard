name: SearchConsoleDashboard
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: $(DEVELOPMENT_TEAM).$(BUNDLE_ID_PREFIX).searchconsole
targets:
  SearchConsoleDashboard:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        LSApplicationCategoryType: public.app-category.productivity
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        AppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SearchConsoleDashboard
        PRODUCT_NAME: Dashboard
    dependencies:
      - target: SearchConsoleWidget
  SearchConsoleWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        GoogleClientID: $(GOOGLE_CLIENT_ID)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SearchConsoleDashboard.Widget
